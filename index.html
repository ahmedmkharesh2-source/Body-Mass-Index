<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة مؤشر كتلة الجسم | BMI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

    <!-- خلفية متحركة -->
    <div class="bg-orbs">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
        <span class="grid-overlay"></span>
    </div>

    <main class="container">

        <!-- البطاقة الرئيسية -->
        <section class="card" id="card">

            <!-- الشعار -->
            <div class="logo-wrap">
                <svg class="logo" viewBox="0 0 120 120" fill="none">
                    <circle class="logo-ring" cx="60" cy="60" r="54" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="339" stroke-linecap="round"/>
                    <defs>
                        <linearGradient id="ringGrad" x1="0" y1="0" x2="120" y2="120">
                            <stop offset="0%" stop-color="#00f5d4"/>
                            <stop offset="50%" stop-color="#7b61ff"/>
                            <stop offset="100%" stop-color="#ff6b9d"/>
                        </linearGradient>
                    </defs>
                    <!-- قلب -->
                    <path class="heart" d="M60 88 C 38 74, 30 58, 38 47 C 45 38, 56 41, 60 50 C 64 41, 75 38, 82 47 C 90 58, 82 74, 60 88 Z" fill="url(#heartGrad)"/>
                    <defs>
                        <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="120">
                            <stop offset="0%" stop-color="#ff6b9d"/>
                            <stop offset="100%" stop-color="#7b61ff"/>
                        </linearGradient>
                    </defs>
                    <!-- نبضة -->
                    <polyline class="pulse-line" points="20,64 42,64 50,48 60,80 68,56 74,64 100,64" stroke="#00f5d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>

            <h1> حساب مؤشر كتلة الجسم</h1>
            <p class="subtitle">اكتشف حالتك الصحية في ثوانٍ عبر مؤشر كتلة الجسم (BMI)</p>

            <!-- حقل الوزن -->
            <div class="field">
                <label for="weight">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="5" r="3"/>
                        <path d="M6.5 21h11l-1.2-9.5a3 3 0 0 0-3-2.5h-2.6a3 3 0 0 0-3 2.5L6.5 21z"/>
                        <path d="M3.5 21h17"/>
                    </svg>
                    الوزن (كجم)
                </label>
                <div class="input-wrap">
                    <input type="number" id="weight" placeholder="ادخل وزنك بالكيلو" min="1" step="0.1"/>
                    <span class="unit">كجم</span>
                </div>
            </div>

            <!-- حقل الطول -->
            <div class="field">
                <label for="height">
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="8" y="2" width="8" height="20" rx="2"/>
                        <path d="M8 6h8M8 18h8M8 10h2M8 14h2M14 10h2M14 14h2"/>
                    </svg>
                    الطول (سم)
                </label>
                <div class="input-wrap">
                    <input type="number" id="height" placeholder="ادخل طولك بالسنتيمتر" min="1" step="0.1"/>
                    <span class="unit">سم</span>
                </div>
            </div>

            <!-- زر الحساب -->
            <button id="btnBIM">
                <span class="btn-shine"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="3"/>
                    <path d="M8 6h8M8.5 11h.01M12 11h.01M15.5 11h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 19h.01M12 19h.01M15.5 19h.01"/>
                </svg>
                احسب مؤشر كتلة الجسم
            </button>

            <!-- النتيجة -->
            <div class="result-box" id="resultBox">
                <h2 id="result"></h2>
                <div class="gauge">
                    <div class="gauge-track">
                        <span class="zone z-1" title="نقص الوزن"></span>
                        <span class="zone z-2" title="وزن صحي"></span>
                        <span class="zone z-3" title="زيادة الوزن"></span>
                        <span class="zone z-4" title="سمنة"></span>
                    </div>
                    <div class="gauge-needle" id="needle"></div>
                </div>
            </div>

        </section>

        <p class="footer-note">صُنع بشغف <span class="heart-mini">♥</span> لصحتك<br><b> 772433858  ابو كنان مخارش</b></p> 
    </main>

    <script src="pagJs.js"></script>
</body>
</html>
